name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  install-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install release artifact
        run: |
          npm pack --silent >/dev/null
          TARBALL=$(node -p "const p=require('./package.json'); p.name+'-'+p.version+'.tgz'")
          mkdir "$RUNNER_TEMP/oasg-install"
          cd "$RUNNER_TEMP/oasg-install"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          ./node_modules/.bin/oasg --version

  install-tagged-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install documented GitHub tag
        run: |
          mkdir "$RUNNER_TEMP/oasg-tag-install"
          cd "$RUNNER_TEMP/oasg-tag-install"
          npm init -y >/dev/null
          npm install "github:${GITHUB_REPOSITORY}#${GITHUB_REF_NAME}"
          ./node_modules/.bin/oasg --version
